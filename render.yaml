services:
  - type: web
    name: remote-cloud-browser
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BROWSER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SCREEN_WIDTH
        value: "1280"
      - key: SCREEN_HEIGHT
        value: "800"
      - key: BROWSER_START_URL
        value: "https://example.com"